<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Matte Obsidian Charcoal Background -->
    <radialGradient id="obsidianBg2" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#1F150E" stop-opacity="1" />
      <stop offset="45%" stop-color="#120E0C" stop-opacity="1" />
      <stop offset="100%" stop-color="#060607" stop-opacity="1" />
    </radialGradient>

    <!-- Thermal Smoke Haze -->
    <radialGradient id="warmSmoke2" cx="50%" cy="44%" r="38%">
      <stop offset="0%" stop-color="#FF9900" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#9E4711" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- CAD Grid Pattern -->
    <pattern id="cadGrid2" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#FFAE00" stroke-width="1" stroke-opacity="0.08" />
    </pattern>
    <radialGradient id="gridMaskGrad2" cx="50%" cy="44%" r="36%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <mask id="gridMask2">
      <rect width="1024" height="1024" fill="url(#gridMaskGrad2)" />
    </mask>

    <!-- CAD Technical Line Gradient -->
    <linearGradient id="cadStrokeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9E4711" stop-opacity="0.70" />
      <stop offset="55%" stop-color="#FF9900" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFEE55" stop-opacity="0.95" />
    </linearGradient>

    <!-- HIERARCHY GRADIENTS (Thermal Arc: V -> S -> A) -->
    <linearGradient id="thermalV2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#80350A" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#C95B12" stop-opacity="0.92" />
    </linearGradient>

    <linearGradient id="thermalS2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8800" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFCC00" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="thermalA2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFEE55" stop-opacity="1" />
      <stop offset="45%" stop-color="#FFFFCC" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>
  </defs>

  <!-- Squircle Base & CAD Grid -->
  <rect width="1024" height="1024" rx="225" fill="url(#obsidianBg2)" />
  <rect width="1024" height="1024" rx="225" fill="url(#cadGrid2)" mask="url(#gridMask2)" />
  <circle cx="512" cy="430" r="370" fill="url(#warmSmoke2)" />

  <!-- CAD Construction Axis & Node Ticks (Subtle Blueprint Detail) -->
  <g stroke="#FFAE00" stroke-opacity="0.22" stroke-width="1.5" fill="none">
    <line x1="230" y1="385" x2="794" y2="385" stroke-dasharray="8 8" />
    <line x1="512" y1="120" x2="512" y2="895" stroke-dasharray="8 8" />
    <!-- CAD Vertex Crosshairs sa mga kanto ng Faceted Bulb -->
    <rect x="389" y="159" width="12" height="12" />
    <rect x="623" y="159" width="12" height="12" />
    <rect x="742" y="309" width="12" height="12" />
    <rect x="270" y="309" width="12" height="12" />
  </g>

  <!-- KONSEPTO 2: GEOMETRIC / FACETED CAD BULB (2B) -->
  <path d="M 428,696 L 404,612 L 276,462 L 276,315 L 395,165 L 629,165 L 748,315 L 748,462 L 620,612 L 596,696" fill="none" stroke="url(#cadStrokeGrad)" stroke-width="6" stroke-linejoin="miter" stroke-miterlimit="10" />
  <!-- Inner Offset Technical Chamfer Line (Kanang Itaas - Tapat ng 'A') -->
  <path d="M 520,183 L 620,183 L 730,322 L 730,440" fill="none" stroke="#FFFFCC" stroke-width="2" stroke-opacity="0.45" />

  <!-- 3A: MINIMALIST SLANTED SCREW THREADS (CHISEL-CUT) -->
  <g fill="url(#thermalV2)">
    <path d="M 432,732 L 596,710 L 590,725 L 426,747 Z" />
    <path d="M 442,772 L 586,753 L 580,768 L 436,787 Z" />
    <path d="M 454,812 L 574,796 L 568,811 L 448,827 Z" />
    <path d="M 476,848 L 552,838 L 530,872 L 494,872 Z" fill="url(#thermalS2)" fill-opacity="0.85" />
  </g>

  <!-- ================================================================= -->
  <!-- ASV SOLUTIONS CORE FILAMENT (banaag-thermal-dynamic-blade.svg)    -->
  <!-- ================================================================= -->
  <g transform="translate(512, 432) scale(0.58) translate(-514, -514)">
    <path d="M 512,556 L 518,556 L 417,790 L 642,480 L 612,475 L 615,468 L 666,466 L 360,886 Z" fill="url(#thermalV2)" />
    <path d="M 658,142 L 404,536 L 486,536 L 392,778 L 399,768 L 510,518 L 430,518 L 664,150 Z" fill="url(#thermalS2)" />
    <path d="M 475,496 L 668,166 L 570,454 L 564,454 L 632,248 L 481,496 Z" fill="url(#thermalA2)" />
  </g>
</svg>